; Production-настройки PHP для образа CMS (DEPLOYMENT.md §2.10).
expose_php = Off
memory_limit = 256M
max_execution_time = 60

; Загрузки (App\Support\UploadLimits): документ — до 20 МБ, одно сохранение
; новости с обложкой, галереей и вложениями — до 128 МБ и 40 файлов.
upload_max_filesize = 20M
post_max_size = 128M
max_file_uploads = 40

opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 24
opcache.max_accelerated_files = 20000
; Код в образе неизменяем: новый релиз — новый контейнер с холодным кэшем.
opcache.validate_timestamps = 0

date.timezone = Asia/Dushanbe
