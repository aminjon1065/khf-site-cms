# nginx CMS внутри стека (deploy/docker/compose.yml). TLS и сжатие — на
# Caddy перед ним; здесь — статика релиза, медиа из общего тома storage и
# FastCGI к PHP-FPM. Повторяет deploy/nginx/cms.conf без TLS-части.

# Протокол исходного запроса: от Caddy приходит X-Forwarded-Proto: https, а
# сайт ходит сюда изнутри стека напрямую (http, без заголовка).
map $http_x_forwarded_proto $khf_forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

map $khf_forwarded_proto $khf_forwarded_port {
    https   443;
    default 80;
}

server {
    listen 80 default_server;
    server_name _;
    root /var/www/html/public;
    index index.php;

    server_tokens off;
    fastcgi_hide_header X-Powered-By;

    # Адрес PHP-FPM — через DNS Docker при каждом запросе, а не один раз при
    # старте nginx: после обновления контейнер cms-app получает новый IP, и
    # с адресом, запомненным при старте, nginx отдавал 502 до перезапуска.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $php_upstream cms-app:9000;
    client_max_body_size 128M;  # UploadLimits::REQUEST_MAX_MB

    # Те же заголовки, что ставит middleware SecurityHeaders, — для ответов,
    # которые отдаёт сам nginx и до PHP не доходят.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~* ^/storage/.*/conversions/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location ^~ /build/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location ~ \.php$ {
        fastcgi_pass $php_upstream;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 120s;

        # Цепочка клиентского IP для лимитов (audit I-1): Caddy пишет
        # X-Forwarded-For с адресом посетителя, nginx дописывает адрес Caddy.
        # Laravel доверяет подсети стека (TRUSTED_PROXIES) и берёт последний
        # недоверенный адрес — подделанный посетителем префикс не учитывается.
        fastcgi_param HTTP_X_FORWARDED_FOR $proxy_add_x_forwarded_for;
        fastcgi_param HTTP_X_FORWARDED_PROTO $khf_forwarded_proto;
        fastcgi_param HTTP_X_FORWARDED_PORT $khf_forwarded_port;
    }

    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
