; Пул PHP-FPM CMS. Число процессов — из PHP_FPM_MAX_CHILDREN стека: его же
; проверяют `ops:capacity` и `ops:production-check` (DEPLOYMENT.md §2.10).
[global]
error_log = /proc/self/fd/2

[www]
listen = 9000
pm = dynamic
pm.max_children = ${PHP_FPM_MAX_CHILDREN}
pm.start_servers = 2
pm.min_spare_servers = 2
pm.max_spare_servers = 4
pm.max_requests = 500
; Журнал Laravel пишет в stderr (LOG_CHANNEL=stderr): без этого вывод
; воркеров FPM терялся бы, а не попадал в `docker compose logs`.
catch_workers_output = yes
decorate_workers_output = no
clear_env = no
ping.path = /fpm-ping
