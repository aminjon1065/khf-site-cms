; Воркеры очередей CMS (DEPLOYMENT.md §2.8, audit J-3/G-2).
; Четыре процесса: основной и media на Redis, и те же два на database —
; резерв забирает задания, сохранённые в БД при недоступности Redis.
; Слушать только `default` нельзя: heartbeat идёт в `critical`, и
; /api/v1/ready останется 503 при «здоровом» простаивающем воркере.
;
; Установка: /etc/supervisor/conf.d/khf-cms-workers.conf
; Затем: supervisorctl reread && supervisorctl update
;
; При смене мажорной версии PHP поправьте PHP_BIN и перезапускайте воркеры
; после каждого деплоя — deploy-cms.sh делает это сам через queue:restart.

[program:khf-cms-worker]
command=/usr/bin/php8.5 artisan queue:work redis --queue=critical,notifications,revalidation,default --sleep=1 --tries=3 --timeout=60 --max-time=3600
directory=/var/www/khf-site-cms/current
autostart=true
autorestart=true
startretries=5
; Больше самого длинного --timeout воркера, чтобы graceful-завершение
; текущей задачи успело закончиться до SIGKILL (требование DEPLOYMENT §2.8).
stopwaitsecs=200
user=www-data
redirect_stderr=true
stdout_logfile=/var/log/khf-cms/worker.log
stopasgroup=true
killasgroup=true

[program:khf-cms-worker-media]
command=/usr/bin/php8.5 artisan queue:work redis --queue=media --sleep=1 --tries=3 --timeout=150 --max-time=3600
directory=/var/www/khf-site-cms/current
autostart=true
autorestart=true
startretries=5
; CPU-heavy конверсии медиа: --timeout=150, поэтому запас ниже больше.
stopwaitsecs=200
user=www-data
redirect_stderr=true
stdout_logfile=/var/log/khf-cms/worker-media.log
stopasgroup=true
killasgroup=true

[program:khf-cms-worker-db-fallback]
command=/usr/bin/php8.5 artisan queue:work database --queue=critical,notifications,revalidation,default --sleep=3 --tries=3 --timeout=60 --max-time=3600
directory=/var/www/khf-site-cms/current
autostart=true
autorestart=true
startretries=5
stopwaitsecs=200
user=www-data
redirect_stderr=true
stdout_logfile=/var/log/khf-cms/worker-db.log
stopasgroup=true
killasgroup=true

[program:khf-cms-worker-db-fallback-media]
command=/usr/bin/php8.5 artisan queue:work database --queue=media --sleep=3 --tries=3 --timeout=150 --max-time=3600
directory=/var/www/khf-site-cms/current
autostart=true
autorestart=true
startretries=5
stopwaitsecs=200
user=www-data
redirect_stderr=true
stdout_logfile=/var/log/khf-cms/worker-db-media.log
stopasgroup=true
killasgroup=true
