# vhost публичного сайта: khf.tj + www (DEPLOYMENT.md §3.3, audit J-3).
# Установка: cp deploy/nginx/front.conf /etc/nginx/sites-available/khf-front
#            ln -s /etc/nginx/sites-available/khf-front /etc/nginx/sites-enabled/
#            nginx -t && systemctl reload nginx

# Пул соединений к Next: без него nginx ходит к апстриму по HTTP/1.0 и
# закрывает соединение после каждого ответа — лишний TCP-handshake на каждый
# запрос страницы.
upstream khf_front {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 443 ssl http2;
    server_name khf.tj www.khf.tj;

    ssl_certificate     /etc/ssl/khf/site.crt;
    ssl_certificate_key /etc/ssl/khf/site.key;

    server_tokens off;

    # Сжатие делает edge, а не Next (обоснование и замеры — DEPLOYMENT §3.3).
    # У апстрима запрашивается несжатый ответ: иначе Next вернул бы gzip,
    # и перепаковать его в Brotli уже нельзя. Без ngx_brotli эту строку
    # следует убрать, чтобы gzip хотя бы делал сам Next.
    proxy_set_header Accept-Encoding "";

    brotli on;
    brotli_comp_level 5;
    brotli_types text/html application/json application/javascript application/xml text/css text/plain image/svg+xml;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_types application/json application/javascript application/xml text/css text/plain image/svg+xml;

    location / {
        proxy_pass http://khf_front;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name khf.tj www.khf.tj;
    return 301 https://khf.tj$request_uri;
}
