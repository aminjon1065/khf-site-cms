# vhost CMS: cms.khf.tj (DEPLOYMENT.md §2.10, audit J-3 + I-1).
# Установка: cp deploy/nginx/cms.conf /etc/nginx/sites-available/khf-cms
#            ln -s /etc/nginx/sites-available/khf-cms /etc/nginx/sites-enabled/
#            nginx -t && systemctl reload nginx

server {
    listen 443 ssl http2;
    server_name cms.khf.tj;
    root /var/www/khf-site-cms/current/public;
    index index.php;

    ssl_certificate     /etc/ssl/khf/cms.crt;
    ssl_certificate_key /etc/ssl/khf/cms.key;

    # Версии ПО — бесплатная разведка для сканера. `expose_php=Off` в php.ini,
    # заголовок PHP-FPM снимается тут же.
    server_tokens off;
    fastcgi_hide_header X-Powered-By;

    location / { try_files $uri $uri/ /index.php?$query_string; }

    # Заголовки безопасности PHP-ответов ставит middleware SecurityHeaders
    # (он же покрывает 404 несовпавших маршрутов). Здесь — те же заголовки для
    # ответов, которые отдаёт сам nginx и которые до PHP не доходят.
    # `always` обязателен, иначе на 4xx/5xx заголовка не будет.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    brotli on;                  # модуль ngx_brotli; без него останется gzip
    brotli_comp_level 5;
    brotli_types application/json application/javascript application/xml text/css text/plain image/svg+xml;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_types application/json application/javascript application/xml text/css text/plain image/svg+xml;

    location ~* ^/storage/.*/conversions/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location ~ ^/build/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.5-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;

        # Цепочка клиентского IP для Laravel (audit I-1): nginx — самый
        # внешний доверенный хоп, он дописывает реальный адрес в конец
        # X-Forwarded-For. Приложение с настроенным TRUSTED_PROXIES берёт
        # последний НЕдоверенный элемент — подделанный клиентом префикс
        # цепочки игнорируется (см. tests/Feature/TrustedProxiesTest.php).
        fastcgi_param HTTP_X_FORWARDED_FOR $proxy_add_x_forwarded_for;
        fastcgi_param HTTP_X_FORWARDED_PROTO $scheme;
        fastcgi_param HTTP_X_FORWARDED_PORT $server_port;
    }

    client_max_body_size 128M;  # одно сохранение с фото и файлами (UploadLimits::REQUEST_MAX_MB)
    location ~ /\.(?!well-known).* { deny all; }
}
