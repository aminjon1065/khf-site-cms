name: tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    # D-4: production runs MySQL (see PROGRESS.md); sqlite is only the fast
    # local/default test connection (phpunit.xml). The sqlite leg stays the
    # canonical full gate (lint/format/types/tests); the mysql leg re-runs
    # just the test suite against the real engine to catch parity bugs
    # (collation, strict mode, JSON columns, date/time functions, ...) that
    # sqlite can't surface. Re-running lint/format/phpstan on the mysql leg
    # would be pure duplication — they don't depend on the DB engine.
    strategy:
      fail-fast: false
      matrix:
        db: [sqlite, mysql]

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
          MYSQL_DATABASE: khf_site_cms_testing
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '22'

      - name: Setup Application
        run: composer setup

      - name: Run CI Checks (sqlite)
        if: matrix.db == 'sqlite'
        run: composer ci:check

      - name: Check CMS bundle budgets
        if: matrix.db == 'sqlite'
        run: npm run bundle:report

      - name: Verify optimized production bootstrap
        if: matrix.db == 'sqlite'
        env:
          APP_ENV: production
          APP_DEBUG: false
          CACHE_STORE: failover
          QUEUE_CONNECTION: failover
          MEDIA_PUBLIC_URL: https://media.example.test
          PHP_FPM_MAX_CHILDREN: 8
        run: |
          php artisan optimize
          php artisan ops:production-check --skip-runtime
          php artisan optimize:clear

      - name: Upload CMS bundle report
        if: matrix.db == 'sqlite'
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: cms-bundle-report
          path: bundle-reports/
          retention-days: 14

      - name: Run tests against MySQL
        if: matrix.db == 'mysql'
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: khf_site_cms_testing
          DB_USERNAME: root
          DB_PASSWORD: ''
        run: |
          php artisan config:clear --ansi
          php artisan test --compact
